<html lang="zh">
<head>

    <title>粒子模型 + 球形网络</title>

        body { 
            margin: 0; 
            overflow: hidden; 
            background: radial-gradient(circle at center, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0) 100%); 
        }
        canvas { 
            display: block; 
        }

        /* 项目卡片样式 */
        #project-card {
            position: fixed;
            top: 50%;
            left: 50%;
            /* 使用固定宽度，让 scale 能够正确生效 */
            width: 500px;
            max-width: 90vw;
            background: rgba(10, 10, 20, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.5);
            border-radius: 20px;
            padding: 0;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            opacity: 0;
            visibility: hidden;
            /* 分开过渡属性，transform 由 JS 控制 */
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 
                0 0 60px rgba(168, 85, 247, 0.4),
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1000;
            overflow: hidden;
            /* 初始 transform 由 JS 设置 */
            transform: translate(-50%, -50%) scale(1);
        }
        
        #project-card.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* 卡片关闭按钮 */
        .card-close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            color: #ffffff;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 10;
        }
        .card-close-btn:hover {
            background: rgba(255, 100, 100, 0.3);
            border-color: rgba(255, 100, 100, 0.5);
            transform: scale(1.1);
        }
        
        /* 卡片头部渐变 */
        .card-header {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(139, 92, 246, 0.2) 100%);
            padding: 24px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
        }
        
        .card-number {
            display: inline-block;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%);
            border-radius: 12px;
            text-align: center;
            line-height: 40px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        
        .card-title {
            margin: 0 0 8px 0;
            font-size: 22px;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.3;
        }
        
        .card-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .card-role {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: #c084fc;
            font-weight: 500;
        }
        
        .card-time {
            display: inline-block;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            line-height: 24px;
        }
        
        /* 卡片内容 */
        .card-body {
            padding: 20px 24px;
        }
        
        .card-description {
            margin: 0 0 16px 0;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }
        
        .card-highlights {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .card-highlights li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
        }
        
        .card-highlights li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            width: 6px;
            height: 6px;
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.6);
        }
        
        /* 卡片底部 */
        .card-footer {
            padding: 16px 24px 24px;
            display: flex;
            gap: 12px;
        }
        
        .card-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
        }
        
        .card-btn-primary {
            background: linear-gradient(135deg, #a855f7 0%, #8b5cf6 100%);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        
        .card-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
        }
        
        .card-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .card-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* 移动端自适应 */
        @media (max-width: 768px) {
            #project-card {
                width: 400px;
                max-width: 92vw;
                border-radius: 16px;
            }
            
            .card-header {
                padding: 16px 20px;
            }
            
            .card-number {
                width: 32px;
                height: 32px;
                line-height: 32px;
                font-size: 14px;
                margin-bottom: 10px;
            }
            
            .card-title {
                font-size: 18px;
                margin: 0 0 6px 0;
            }
            
            .card-meta {
                gap: 8px;
            }
            
            .card-role {
                font-size: 11px;
                padding: 3px 10px;
            }
            
            .card-time {
                font-size: 11px;
                line-height: 20px;
            }
            
            .card-body {
                padding: 16px 20px;
            }
            
            .card-description {
                font-size: 13px;
                margin: 0 0 12px 0;
            }
            
            .card-highlights li {
                font-size: 12px;
                padding-left: 16px;
                margin-bottom: 6px;
            }
            
            .card-highlights li::before {
                width: 5px;
                height: 5px;
                top: 6px;
            }
            
            .card-footer {
                padding: 12px 20px 20px;
                gap: 10px;
            }
            
            .card-btn {
                padding: 10px 16px;
                font-size: 13px;
                border-radius: 8px;
            }
        }
        
        @media (max-width: 480px) {
            #project-card {
                width: 320px;
                max-width: 95vw;
                border-radius: 14px;
            }
            
            .card-header {
                padding: 14px 16px;
            }
            
            .card-number {
                width: 28px;
                height: 28px;
                line-height: 28px;
                font-size: 12px;
            }
            
            .card-title {
                font-size: 16px;
            }
            
            .card-body {
                padding: 14px 16px;
            }
            
            .card-description {
                font-size: 12px;
            }
            
            .card-highlights li {
                font-size: 11px;
            }
            
            .card-footer {
                padding: 10px 16px 16px;
                flex-direction: column;
                gap: 8px;
            }
            
            .card-btn {
                width: 100%;
                padding: 12px;
            }
        }
        
        /* 背景遮罩 */
        #card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999;
        }
        
        #card-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        
        /* 旧tooltip隐藏 */
        #tooltip {
            display: none;
        }
    </style>
</head>

            { id: 48, name: '待添加', nameEn: 'Coming Soon', description: '即将上线，敬请期待...', descriptionEn: 'Coming soon, stay tuned...', hasWork: false },
            { id: 49, name: '待添加', nameEn: 'Coming Soon', description: '即将上线，敬请期待...', descriptionEn: 'Coming soon, stay tuned...', hasWork: false },
            { id: 50, name: '待添加', nameEn: 'Coming Soon', description: '即将上线，敬请期待...', descriptionEn: 'Coming soon, stay tuned...', hasWork: false }
        ];
        
        // 当前语言
        let currentLang = 'zh';

        // 1. 初始化场景、相机、渲染器
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        // ===== 与父页面通信：根据全局滚动进度同步模型缩放 =====

        let globalSceneScale = 1;

            const data = e.data || {};
            if (data.type === 'scrollScale') {
                const minScale = 0.5;
                const maxScale = 1.5;
                let s = Number(data.scale);
                if (!Number.isFinite(s)) return;
                s = Math.max(minScale, Math.min(maxScale, s));
                globalSceneScale = s;
                scene.scale.setScalar(s);
                
                // 同步更新卡片缩放

                if (projectCard) {
                    projectCard.style.transform = `translate(-50%, -50%) scale(${s})`;

        // ===== 第一部分：中心粒子模型 =====
        let particleSystem = null;
        let originalPositions = null;
        let randomOffsets = null;
        let mouseOverModel = false;
        let targetProgress = 0;
        let currentProgress = 0;

        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255, 220, 150, 1)');
            gradient.addColorStop(0.4, 'rgba(255, 160, 80, 0.9)');
            gradient.addColorStop(0.7, 'rgba(255, 100, 30, 0.5)');
            gradient.addColorStop(1, 'rgba(255, 50, 0, 0)');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const particleTexture = createParticleTexture();

        function convertToParticles(geometry) {
            geometry.computeVertexNormals();
            const positionAttribute = geometry.getAttribute('position');
            const allPositions = [];
            
            const densityMultiplier = 1.2;
            
            for (let i = 0; i < positionAttribute.count; i++) {
                const vertex = new THREE.Vector3();
                vertex.fromBufferAttribute(positionAttribute, i);
                
                for (let j = 0; j < Math.ceil(densityMultiplier); j++) {
                    if (j >= densityMultiplier && Math.random() > (densityMultiplier % 1)) {
                        continue;
                    }
                    const offset = new THREE.Vector3(
                        (Math.random() - 0.5) * 0.017,
                        (Math.random() - 0.5) * 0.017,
                        (Math.random() - 0.5) * 0.017
                    );
                    allPositions.push(
                        vertex.x + offset.x,
                        vertex.y + offset.y,
                        vertex.z + offset.z
                    );
                }
            }
            
            if (allPositions.length > 0) {
                const particleGeometry = new THREE.BufferGeometry();
                const scaledPositions = [];
                for (let i = 0; i < allPositions.length; i += 3) {
                    scaledPositions.push(allPositions[i] * 1.5);
                    scaledPositions.push(allPositions[i + 1] * 1.5);
                    scaledPositions.push(allPositions[i + 2] * 1.5);
                }
                const positions = new Float32Array(scaledPositions);
                
                particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                originalPositions = new Float32Array(scaledPositions);
                
                randomOffsets = new Float32Array(allPositions.length);
                for (let i = 0; i < randomOffsets.length; i++) {
                    randomOffsets[i] = (Math.random() - 0.5) * 1;
                }
                
                const colors = new Float32Array(allPositions.length);
                for (let i = 0; i < colors.length; i += 3) {
                    colors[i] = 1.0;
                    colors[i + 1] = 0.4 + Math.random() * 0.4;
                    colors[i + 2] = 0.1 + Math.random() * 0.2;
                }
                particleGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const particleMaterial = new THREE.PointsMaterial({
                    size: 0.1125,
                    map: particleTexture,
                    vertexColors: true,
                    transparent: true,
                    opacity: 1,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    sizeAttenuation: true
                });
                
                particleSystem = new THREE.Points(particleGeometry, particleMaterial);
                scene.add(particleSystem);
                
                const box = new THREE.Box3().setFromObject(particleSystem);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                particleSystem.position.sub(center);
            }
        }

        function createFallbackGeometry() {
            const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 128, 32);
            return geometry;
        }

        const loader = new THREE.GLTFLoader();
        loader.load(
            '火1.glb',
            function (gltf) {
                const model = gltf.scene;
                
                let mergedGeometry = null;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.geometry = child.geometry.clone();
                        child.updateMatrixWorld(true);
                        child.geometry.applyMatrix4(child.matrixWorld);
                        
                        if (mergedGeometry === null) {
                            mergedGeometry = child.geometry;
                        } else {
                            mergedGeometry = child.geometry;
                        }
                    }
                });
                
                if (mergedGeometry) {
                    convertToParticles(mergedGeometry);
                } else {
                    convertToParticles(createFallbackGeometry());
                }
                
                scene.remove(model);
            },
            undefined,
            function (error) {
                convertToParticles(createFallbackGeometry());
            }
        );

        function noise(x, y, z) {
            return Math.sin(x * 0.5) * Math.cos(y * 0.5) + 
                   Math.sin(y * 0.3) * Math.cos(z * 0.3) + 
                   Math.sin(z * 0.4) * Math.cos(x * 0.4);
        }

        // ===== 第二部分：外围球形网络 =====
        const networkNodes = [];
        const networkLines = [];
        // 节点数量：60个无项目节点形成球 + 6个有项目节点叠加 = 66个节点
        const nodeCount = 66;
        const networkRadius = 10;

        function createNetworkNodeTexture(hasWork) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            if (hasWork) {
                gradient.addColorStop(0, 'rgba(255, 220, 150, 1)');
                gradient.addColorStop(0.3, 'rgba(255, 200, 120, 1)');
                gradient.addColorStop(0.6, 'rgba(255, 180, 90, 1)');
                gradient.addColorStop(1, 'rgba(255, 150, 60, 0)');
            } else {
                gradient.addColorStop(0, 'rgba(220, 200, 180, 1)');
                gradient.addColorStop(0.3, 'rgba(200, 180, 150, 1)');
                gradient.addColorStop(0.6, 'rgba(180, 160, 120, 0.8)');
                gradient.addColorStop(1, 'rgba(150, 130, 90, 0)');
            }
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        const networkNodePositions = [];
        
        // 6个有项目的节点均匀分布在球体不同方向（正六面体顶点位置，后面的往上偏移避免重叠）
        const workNodePositions = [
            { x: 1, y: 0, z: 0 },           // 右
            { x: -1, y: 0, z: 0 },          // 左
            { x: 0, y: 1, z: 0 },           // 上
            { x: 0, y: -1, z: 0 },          // 下
            { x: 0, y: 0, z: 1 },           // 前
            { x: 0, y: 0.5, z: -0.866 }     // 后（往上偏移30度，避免和前面重叠）
        ];
        
        // 为所有节点生成位置（60个无项目节点形成球 + 6个项目节点叠加）
        const allPositions = [];
        
        // 先添加60个斐波那契分布的节点位置（形成完整的球）
        const fibCount = 60;
        for (let i = 0; i < fibCount; i++) {
            const phi = Math.acos(1 - 2 * (i + 0.5) / fibCount);
            const theta = Math.PI * (1 + Math.sqrt(5)) * i;
            
            const x = networkRadius * Math.cos(theta) * Math.sin(phi);
            const y = networkRadius * Math.sin(theta) * Math.sin(phi);
            const z = networkRadius * Math.cos(phi);
            
            allPositions.push({ x, y, z });
        }
        
        // 再添加6个项目节点位置（叠加在球上）
        for (let i = 0; i < workNodePositions.length; i++) {
            const pos = workNodePositions[i];
            const r = networkRadius;
            const len = Math.sqrt(pos.x * pos.x + pos.y * pos.y + pos.z * pos.z);
            allPositions.push({
                x: r * pos.x / len,
                y: r * pos.y / len,
                z: r * pos.z / len
            });
        }
        
        // 项目节点是后6个（索引60-65）
        const hasWorkIndices = [60, 61, 62, 63, 64, 65];
        
        // 复制到最终位置数组
        for (let i = 0; i < nodeCount; i++) {
            networkNodePositions.push({
                x: allPositions[i].x,
                y: allPositions[i].y,
                z: allPositions[i].z
            });
        }

        // 创建所有节点（66个），索引60-65是有项目的，其余0-59是无项目的
        for (let i = 0; i < nodeCount; i++) {
            // 获取对应的数据（项目节点用worksData，无项目节点用默认数据）
            const workDataIndex = hasWorkIndices.indexOf(i);
            const workData = workDataIndex !== -1 ? worksData[workDataIndex] : {
                id: i + 1,
                name: '节点' + (i + 1),
                nameEn: 'Node ' + (i + 1),
                hasWork: false
            };
            const pos = networkNodePositions[i];
            const hasWork = workDataIndex !== -1; // 检查是否是项目节点
            
            const nodeGeometry = new THREE.BufferGeometry();
            const positions = new Float32Array([0, 0, 0]);
            nodeGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const nodeMaterial = new THREE.PointsMaterial({
                size: hasWork ? 0.588 : 0.315,
                map: createNetworkNodeTexture(hasWork),
                transparent: true,
                opacity: hasWork ? 2.0 : 1.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            const node = new THREE.Points(nodeGeometry, nodeMaterial);
            node.position.set(pos.x, pos.y, pos.z);
            node.userData = workData;
            node.userData.hasWork = hasWork; // 显式设置hasWork
            scene.add(node);
            networkNodes.push(node);
            
            // 为有项目的节点添加文字标签（对话框样式）
            if (hasWork) {
                // 创建外层容器（定位在节点位置）
                const labelWrapper = document.createElement('div');
                labelWrapper.className = 'node-label-wrapper';
                labelWrapper.style.cssText = `
                    position: absolute;
                    pointer-events: none;
                    z-index: 100;
                    opacity: 0.95;
                    transition: opacity 0.3s ease;
                    transform-origin: left center;
                `;
                
                // 创建内容容器（包含箭头和文字）
                const labelContent = document.createElement('div');
                labelContent.className = 'node-label-content';
                labelContent.style.cssText = `
                    position: relative;
                    display: flex;
                    align-items: center;
                `;
                
                // 添加箭头（在左侧，直接连着粒子）
                const arrow = document.createElement('div');
                arrow.className = 'node-label-arrow';
                arrow.style.cssText = `
                    width: 0;

                    border-style: solid;
                    border-width: 6px 8px 6px 0;
                    border-color: transparent rgba(255, 140, 0, 0.8) transparent transparent;
                    flex-shrink: 0;
                `;
                
                // 添加文字标签
                const labelDiv = document.createElement('div');
                labelDiv.className = 'node-label';
                labelDiv.textContent = currentLang === 'zh' ? workData.name : workData.nameEn;
                labelDiv.style.cssText = `
                    color: rgba(255, 255, 255, 0.95);
                    font-size: 12px;
                    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
                    font-weight: 500;
                    white-space: nowrap;
                    padding: 8px 14px;
                    background: rgba(20, 10, 5, 0.9);
                    border-radius: 10px;
                    border: 1px solid rgba(255, 140, 0, 0.6);
                    box-shadow: 
                        0 0 20px rgba(255, 140, 0, 0.3),
                        0 4px 15px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
                    margin-left: -1px;
                `;
                
                labelContent.appendChild(arrow);
                labelContent.appendChild(labelDiv);
                labelWrapper.appendChild(labelContent);
                document.body.appendChild(labelWrapper);
                node.userData.labelElement = labelWrapper;
                node.userData.labelArrow = arrow;
                node.userData.labelContent = labelDiv;
            }
        }

        const networkLineMaterial = new THREE.LineDashedMaterial({
            color: 0xffaa55,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            dashSize: 0.25,
            gapSize: 0.15
        });

        for (let i = 0; i < nodeCount; i++) {
            for (let j = i + 1; j < nodeCount; j++) {
                const pos1 = networkNodePositions[i];
                const pos2 = networkNodePositions[j];
                
                const dist = Math.sqrt(
                    Math.pow(pos1.x - pos2.x, 2) +
                    Math.pow(pos1.y - pos2.y, 2) +
                    Math.pow(pos1.z - pos2.z, 2)
                );
                
                if (dist < 8) {
                    const p1 = new THREE.Vector3(pos1.x, pos1.y, pos1.z);
                    const p2 = new THREE.Vector3(pos2.x, pos2.y, pos2.z);
                    
                    const center = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                    const centerDir = center.clone().normalize();
                    const midOffset = centerDir.multiplyScalar(networkRadius * 0.15);
                    const midPoint = center.clone().add(midOffset);
                    
                    const curve = new THREE.QuadraticBezierCurve3(p1, midPoint, p2);
                    const curvePoints = curve.getPoints(30);
                    const lineGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
                    
                    const line = new THREE.Line(lineGeometry, networkLineMaterial);
                    line.computeLineDistances();
                    scene.add(line);
                    networkLines.push(line);
                }
            }
        }

        // ===== 第三部分：背景粒子 =====
        const bgParticlesCount = 800;
        const bgParticlesGeometry = new THREE.BufferGeometry();
        const bgPositions = new Float32Array(bgParticlesCount * 3);

        // 使用斐波那契球面分布算法，让粒子更均匀
        for (let i = 0; i < bgParticlesCount; i++) {
            const index = i * 3;
            
            // 斐波那契球面分布
            const phi = Math.acos(1 - 2 * (i + 0.5) / bgParticlesCount);
            const theta = Math.PI * (1 + Math.sqrt(5)) * i;
            
            // 在球壳范围内随机半径，形成厚度
            const r = 14.7 + Math.random() * 6.3;
            
            bgPositions[index] = r * Math.cos(theta) * Math.sin(phi);
            bgPositions[index + 1] = r * Math.sin(theta) * Math.sin(phi);
            bgPositions[index + 2] = r * Math.cos(phi);
        }

        bgParticlesGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
        
        const bgOriginalPositions = new Float32Array(bgPositions);

        const bgParticlesMaterial = new THREE.PointsMaterial({
            size: 0.072,
            color: 0xff8833,
            transparent: true,
            opacity: 0.75,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const bgParticles = new THREE.Points(bgParticlesGeometry, bgParticlesMaterial);
        scene.add(bgParticles);

        // ===== 交互逻辑 =====
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredNode = null;
        
        let bgMousePos = new THREE.Vector3(0, 0, 0);
        let bgMouseActive = false;
        
        // 项目卡片元素
        const projectCard = document.getElementById('project-card');
        const cardOverlay = document.getElementById('card-overlay');
        const cardTitle = document.getElementById('card-title');
        const cardRole = document.getElementById('card-role');
        const cardTime = document.getElementById('card-time');
        const cardDescription = document.getElementById('card-description');
        const cardHighlights = document.getElementById('card-highlights');
        const cardBtnView = document.getElementById('card-btn-view');
        const cardBtnClose = document.getElementById('card-btn-close');
        const cardBtnDoc = document.getElementById('card-btn-doc');
        
        // 初始化卡片 transform（使用默认缩放 1）
        projectCard.style.transform = `translate(-50%, -50%) scale(${globalSceneScale})`;
        
        // 显示项目卡片
        function showProjectCard(node) {
            if (!node || !node.userData.hasWork) return;
            
            const data = node.userData;
            cardTitle.textContent = currentLang === 'zh' ? data.name : data.nameEn;
            cardRole.textContent = data.role || '产品经理';
            cardTime.textContent = data.time || '';
            cardDescription.textContent = currentLang === 'zh' ? data.description : data.descriptionEn;
            
            // 更新亮点列表
            cardHighlights.innerHTML = '';
            if (data.highlights && data.highlights.length > 0) {
                data.highlights.forEach(highlight => {
                    const li = document.createElement('li');
                    li.textContent = highlight;
                    cardHighlights.appendChild(li);
                });
            }
            
            // 设置查看按钮链接
            if (data.link && data.link !== '#') {
                cardBtnView.onclick = () => {
                    window.open(data.link, '_blank');
                };
                cardBtnView.style.opacity = '1';
                cardBtnView.style.cursor = 'pointer';
            } else {
                cardBtnView.onclick = null;
                cardBtnView.style.opacity = '0.5';
                cardBtnView.style.cursor = 'not-allowed';

            // 设置查看技术文档按钮（仅对特定项目显示）
            const hasDocProjects = ['▲ AI对话收藏整理工具', '▲ 塔罗智能工作平台'];
            if (hasDocProjects.includes(data.name)) {
                cardBtnDoc.style.display = 'inline-block';
                if (data.docLink) {
                    cardBtnDoc.onclick = () => {
                        window.open(data.docLink, '_blank');
                    };
                } else {
                    cardBtnDoc.onclick = () => {
                        alert('技术文档即将上线');
                    };
                }
            } else {
                cardBtnDoc.style.display = 'none';
            }

            // 显示卡片和遮罩（transform 已由 message 监听器实时更新）
            projectCard.classList.add('visible');
            cardOverlay.classList.add('visible');
        }
        
        // 隐藏项目卡片
        function hideProjectCard() {
            projectCard.classList.remove('visible');
            cardOverlay.classList.remove('visible');
        }
        
        // 关闭按钮事件
        cardBtnClose.addEventListener('click', hideProjectCard);
        cardOverlay.addEventListener('click', hideProjectCard);
        
        // ESC键关闭卡片
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideProjectCard();
            }
        });

        function updateTooltip(node) {
            // 旧的tooltip已禁用，使用新的卡片系统
            if (node && node.userData.hasWork) {
                showProjectCard(node);
            } else {
                hideProjectCard();
            }
        }
        
        // 监听来自父窗口的语言切换消息
        window.addEventListener('message', (e) => {
            const data = e.data || {};
            if (data.type === 'languageChange') {
                currentLang = data.lang;
                // 如果当前有悬停的节点，更新tooltip
                if (hoveredNode) {
                    updateTooltip(hoveredNode);
                }
                // 更新所有节点标签文字
                networkNodes.forEach(node => {
                    if (node.userData.labelContent && node.userData.hasWork) {
                        node.userData.labelContent.textContent = currentLang === 'zh' ? node.userData.name : node.userData.nameEn;
                    }
                });
            }
        });



        let isInSphere = false;
        
        function checkMouseInSphere(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersectSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), networkRadius + 2);
            
            const intersections = raycaster.ray.intersectSphere(intersectSphere, new THREE.Vector3());
            return intersections !== null;
        }
        
        renderer.domElement.addEventListener('mousemove', (event) => {
            const wasInSphere = isInSphere;
            isInSphere = checkMouseInSphere(event);
            
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const bgPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
            const intersectPoint = new THREE.Vector3();
            raycaster.ray.intersectPlane(bgPlane, intersectPoint);
            bgMousePos.copy(intersectPoint);
            bgMouseActive = true;
            
            if (isInSphere && !wasInSphere) {
                targetProgress = 1;
            } else if (!isInSphere && wasInSphere) {
                targetProgress = 0;
                updateTooltip(null);
                if (hoveredNode) {
                    if (hoveredNode.userData.hasWork) {
                        hoveredNode.material.size = 0.588;
                        hoveredNode.material.opacity = 2.0;
                    }
                    hoveredNode = null;
                }
            }
            
            if (isInSphere) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(networkNodes);
                
                if (intersects.length > 0) {
                    const node = intersects[0].object;
                    if (hoveredNode !== node) {
                        hoveredNode = node;
                        updateTooltip(node);
                        
                        if (node.userData.hasWork) {
                            node.material.size = 0.823;
                            node.material.opacity = 2.5;
                        }
                    }
                    
                    tooltip.style.left = (event.clientX + 15) + 'px';
                    tooltip.style.top = (event.clientY + 15) + 'px';
                } else {
                    if (hoveredNode) {
                        if (hoveredNode.userData.hasWork) {
                            hoveredNode.material.size = 0.588;
                            hoveredNode.material.opacity = 2.0;
                        }
                        hoveredNode = null;
                        updateTooltip(null);
                    }
                }
            }
        });

        renderer.domElement.addEventListener('mouseleave', () => {
            bgMouseActive = false;
        });

        // ===== 触摸事件支持（移动端） =====
        let touchStartY = 0;
        let touchStartX = 0;
        let isTouchInSphere = false;
        let touchMoved = false;
        let touchStartTime = 0;
        
        renderer.domElement.addEventListener('touchstart', (event) => {
            if (event.touches.length === 1) {
                touchStartY = event.touches[0].clientY;
                touchStartX = event.touches[0].clientX;
                touchStartTime = Date.now();
                touchMoved = false;
                
                // 检查触摸是否在球体内
                const rect = renderer.domElement.getBoundingClientRect();
                const touchX = ((event.touches[0].clientX - rect.left) / rect.width) * 2 - 1;
                const touchY = -((event.touches[0].clientY - rect.top) / rect.height) * 2 + 1;
                
                raycaster.setFromCamera(new THREE.Vector2(touchX, touchY), camera);
                const intersectSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), networkRadius + 2);
                const intersections = raycaster.ray.intersectSphere(intersectSphere, new THREE.Vector3());
                isTouchInSphere = intersections !== null;
                
                // 如果触摸在球体内，显示 tooltip
                if (isTouchInSphere) {
                    raycaster.setFromCamera(new THREE.Vector2(touchX, touchY), camera);
                    const intersects = raycaster.intersectObjects(networkNodes);
                    
                    if (intersects.length > 0) {
                        const node = intersects[0].object;
                        if (node.userData.hasWork) {
                            hoveredNode = node;
                            updateTooltip(node);
                            node.material.size = 0.823;
                            node.material.opacity = 2.5;
                            
                            // 设置 tooltip 位置
                            const touch = event.touches[0];
                            tooltip.style.left = (touch.clientX + 15) + 'px';
                            tooltip.style.top = (touch.clientY + 15) + 'px';
                        }
                    }
                }
            }
        }, { passive: true });
        
        renderer.domElement.addEventListener('touchmove', (event) => {
            if (event.touches.length === 1) {
                const touchY = event.touches[0].clientY;
                const touchX = event.touches[0].clientX;
                const deltaY = touchStartY - touchY;
                const deltaX = touchStartX - touchX;
                
                // 标记为已移动
                if (Math.abs(deltaY) > 5 || Math.abs(deltaX) > 5) {
                    touchMoved = true;
                }
                
                // 更新 tooltip 位置
                if (hoveredNode && isTouchInSphere) {
                    tooltip.style.left = (event.touches[0].clientX + 15) + 'px';
                    tooltip.style.top = (event.touches[0].clientY + 15) + 'px';
                }
                
                // 如果触摸不在球体内，允许父页面滚动
                if (!isTouchInSphere) {
                    return;
                }
                
                // 在球体内且垂直滑动较大时，允许父页面滚动
                if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 30) {
                    // 隐藏 tooltip
                    if (hoveredNode) {
                        if (hoveredNode.userData.hasWork) {
                            hoveredNode.material.size = 0.588;
                            hoveredNode.material.opacity = 2.0;
                        }
                        hoveredNode = null;
                        updateTooltip(null);
                    }
                    return;
                }
                
                // 在球体内水平滑动时，阻止默认行为（用于旋转模型）
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    event.preventDefault();
                }
            }
        }, { passive: false });
        
        renderer.domElement.addEventListener('touchend', (event) => {
            const touchDuration = Date.now() - touchStartTime;
            
            // 如果是点击（未移动且时间短），处理跳转
            if (!touchMoved && touchDuration < 300 && hoveredNode && isTouchInSphere) {
                if (hoveredNode.userData.hasWork && hoveredNode.userData.link) {
                    window.parent.postMessage({
                        type: 'navigate',
                        url: hoveredNode.userData.link
                    }, '*');
                }
            }
            
            // 延迟隐藏 tooltip
            setTimeout(() => {
                if (hoveredNode) {
                    if (hoveredNode.userData.hasWork) {
                        hoveredNode.material.size = 0.588;
                        hoveredNode.material.opacity = 2.0;
                    }
                    hoveredNode = null;
                    updateTooltip(null);
                }
            }, 2000);
        });

        // ===== 窗口自适应 =====
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ===== 动画循环 =====
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            const time = clock.getElapsedTime();
            
            if (particleSystem && originalPositions) {
                const smoothSpeed = 0.015;
                currentProgress += (targetProgress - currentProgress) * smoothSpeed;
                
                const positions = particleSystem.geometry.attributes.position.array;
                const count = positions.length / 3;
                
                const breatheScale = 1 + Math.sin(time * 1.5) * 0.08;
                const breatheIntensity = (Math.sin(time * 1.5) + 1) / 2;
                
                for (let i = 0; i < count; i++) {
                    const index = i * 3;
                    
                    const ox = originalPositions[index];
                    const oy = originalPositions[index + 1];
                    const oz = originalPositions[index + 2];
                    
                    const jitterStrength = 0.017 + breatheIntensity * 0.01;
                    const jx = noise(ox + time * 2, oy, oz) * jitterStrength;
                    const jy = noise(ox, oy + time * 2, oz) * jitterStrength;
                    const jz = noise(ox, oy, oz + time * 2) * jitterStrength;
                    
                    const dirX = ox;
                    const dirY = oy;
                    const dirZ = oz;
                    
                    const len = Math.sqrt(dirX * dirX + dirY * dirY + dirZ * dirZ) || 1;
                    const ndirX = dirX / len;
                    const ndirY = dirY / len;
                    const ndirZ = dirZ / len;
                    
                    const spreadDistance = 3.15 * currentProgress;
                    const randomSpread = randomOffsets[index] * currentProgress * 1.05;
                    
                    const bx = ox * breatheScale;
                    const by = oy * breatheScale;
                    const bz = oz * breatheScale;
                    
                    positions[index] = bx + jx + ndirX * spreadDistance + randomSpread;
                    positions[index + 1] = by + jy + ndirY * spreadDistance + randomSpread;
                    positions[index + 2] = bz + jz + ndirZ * spreadDistance + randomSpread;
                }
                
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.material.opacity = (1 - currentProgress * 0.5) * (0.95 + breatheIntensity * 0.1);
                particleSystem.material.size = (0.1125 + currentProgress * 0.075) * (0.95 + breatheIntensity * 0.1);
                particleSystem.rotation.y = time * 0.1;
            }
            
            networkNodes.forEach((node, i) => {
                const pulse = 1 + Math.sin(time * 2 + i) * 0.05;
                node.scale.setScalar(pulse);
            });
            
            if (bgMouseActive) {
                const bgPositions = bgParticles.geometry.attributes.position.array;
                const bgCount = bgPositions.length / 3;
                
                const mLen = Math.sqrt(bgMousePos.x * bgMousePos.x + bgMousePos.y * bgMousePos.y + bgMousePos.z * bgMousePos.z);
                let mx = 0, my = 0, mz = 1;
                if (mLen > 0) {
                    mx = bgMousePos.x / mLen;
                    my = bgMousePos.y / mLen;
                    mz = bgMousePos.z / mLen;
                }
                
                for (let i = 0; i < bgCount; i++) {
                    const index = i * 3;
                    const ox = bgOriginalPositions[index];
                    const oy = bgOriginalPositions[index + 1];
                    const oz = bgOriginalPositions[index + 2];
                    
                    const pLen = Math.sqrt(ox * ox + oy * oy + oz * oz);
                    const px = ox / pLen;
                    const py = oy / pLen;
                    const pz = oz / pLen;
                    
                    const dot = Math.max(-1, Math.min(1, px * mx + py * my + pz * mz));
                    const angle = Math.acos(dot);
                    const arcDist = angle * (14.7 + 3.15);
                    
                    if (arcDist < 6.3 && arcDist > 0) {
                        const waveRadius = 6.3;
                        const waveStrength = 1.26;
                        const waveDecay = Math.max(0, 1 - arcDist / waveRadius);
                        const waveFactor = Math.sin(arcDist * 1.5 - time * 5) * waveDecay;
                        const displacement = waveFactor * waveStrength;
                        
                        bgPositions[index] = ox + px * displacement;
                        bgPositions[index + 1] = oy + py * displacement;
                        bgPositions[index + 2] = oz + pz * displacement;
                    } else {
                        bgPositions[index] = ox;
                        bgPositions[index + 1] = oy;
                        bgPositions[index + 2] = oz;
                    }
                }
                
                bgParticles.geometry.attributes.position.needsUpdate = true;
            } else {
                const bgPositions = bgParticles.geometry.attributes.position.array;
                for (let i = 0; i < bgPositions.length; i++) {
                    bgPositions[i] = bgOriginalPositions[i];
                }
                bgParticles.geometry.attributes.position.needsUpdate = true;
            }
            
            // 背景粒子旋转速度与中心粒子模型一致
            bgParticles.rotation.y = time * 0.1;
            
            // 更新节点标签位置和大小
            networkNodes.forEach((node, i) => {
                if (node.userData.labelElement) {
                    // 获取节点当前的缩放值（与节点脉冲动画同步）
                    const pulse = 1 + Math.sin(time * 2 + i) * 0.05;
                    const scale = Math.max(0.85, Math.min(1.15, pulse));
                    
                    // 计算节点的实际世界坐标（包含缩放）
                    // 使用 node.matrixWorld 获取世界变换矩阵
                    const worldPosition = new THREE.Vector3();
                    node.getWorldPosition(worldPosition);
                    
                    // 将世界坐标投影到屏幕
                    const vector = worldPosition.clone();
                    vector.project(camera);
                    
                    const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;
                    
                    // 检查是否在屏幕内且在球体前方
                    if (vector.z < 1 && x > 0 && x < window.innerWidth && y > 0 && y < window.innerHeight) {
                        const labelEl = node.userData.labelElement;
                        const contentEl = node.userData.labelContent;
                        
                        // 容器直接定位在节点位置（箭头起点）
                        // 标签内容向右延伸
                        labelEl.style.left = x + 'px';
                        labelEl.style.top = (y - contentEl.offsetHeight * scale / 2) + 'px';
                        labelEl.style.transform = `scale(${scale})`;
                        labelEl.style.opacity = '0.95';
                    } else {
                        node.userData.labelElement.style.opacity = '0';
                    }
                }
            });
            
            renderer.render(scene, camera);
        }
        
        animate();
    </script>
</body>
