<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 背景像素点 */
        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.1;
        }

        /* 气泡容器 */
        .bubble-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 气泡基础样式 */
        .bubble {
            position: absolute;
            border-radius: 50%;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2;
            transform-style: preserve-3d;
            /* 玻璃球壳效果 */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 50%, rgba(168, 85, 247, 0.1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 0 30px rgba(168, 85, 247, 0.4),
                inset 0 0 30px rgba(255, 255, 255, 0.1),
                0 8px 25px rgba(0, 0, 0, 0.5),
                inset -5px -5px 15px rgba(0, 0, 0, 0.3),
                inset 5px 5px 15px rgba(255, 255, 255, 0.05);
            /* 内层光效 */
            overflow: hidden;
        }

        /* 内层光效 */
        .bubble::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, rgba(168, 85, 247, 0.2) 30%, rgba(79, 70, 229, 0.1) 60%, transparent 100%);
            animation: glow 6s ease-in-out infinite;
        }



        /* 最大气泡（赵梦婷）- 使用 vw/vh 实现自适应 */
        .bubble-large {
            width: clamp(120px, 15vw, 200px);
            height: clamp(120px, 15vw, 200px);
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.4);
        }

        .bubble-large:hover,
        .bubble-large.active {
            transform: scale(1.2);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.9);
            border-color: rgba(168, 85, 247, 0.9);
        }

        /* 姓名文字 - 自适应字体 */
        .name-text {
            font-size: clamp(16px, 2vw, 24px);
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.7);
            transition: all 0.3s ease;
            position: relative;
            z-index: 3;
        }

        .bubble:hover .name-text,
        .bubble.active .name-text {
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.9);
            color: #ffffff;
            transform: scale(1.1);
        }

        /* 照片样式 */
        .profile-photo {
            display: none;
        }

        /* 次大气泡（核心优势） - 使用 vw/vh 实现自适应 */
        .bubble-medium {
            width: clamp(100px, 13vw, 180px);
            height: clamp(100px, 13vw, 180px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .bubble-medium:hover,
        .bubble-medium.active {
            transform: scale(1.2);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.7);
            border-color: rgba(168, 85, 247, 0.7);
        }

        /* 再次大气泡（工作经历） - 使用 vw/vh 实现自适应 */
        .bubble-experience {
            width: clamp(90px, 11vw, 160px);
            height: clamp(90px, 11vw, 160px);
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.15);
        }

        .bubble-experience:hover,
        .bubble-experience.active {
            transform: scale(1.2);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
            border-color: rgba(168, 85, 247, 0.6);
        }

        /* 中气泡（AI相关技能） - 使用 vw/vh 实现自适应 */
        .bubble-skill-ai {
            width: clamp(50px, 6vw, 80px);
            height: clamp(50px, 6vw, 80px);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.1);
        }

        .bubble-skill-ai:hover,
        .bubble-skill-ai.active {
            transform: scale(1.2);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
            border-color: rgba(168, 85, 247, 0.5);
        }

        /* 最小气泡（其他技能） - 使用 vw/vh 实现自适应 */
        .bubble-skill-other {
            width: clamp(40px, 5vw, 60px);
            height: clamp(40px, 5vw, 60px);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.15);
            box-shadow: 0 0 5px rgba(168, 85, 247, 0.08);
        }

        .bubble-skill-other:hover,
        .bubble-skill-other.active {
            transform: scale(1.2);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
            border-color: rgba(168, 85, 247, 0.4);
        }

        /* 气泡文字 - 自适应字体 */
        .bubble-text {
            text-align: center;
            font-size: clamp(10px, 1.2vw, 14px);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            padding: clamp(5px, 1vw, 10px);
            transition: all 0.3s ease;
            position: relative;
            z-index: 3;
        }

        .bubble-medium .bubble-text {
            font-size: clamp(11px, 1.4vw, 16px);
        }

        .bubble-experience .bubble-text {
            font-size: clamp(10px, 1.2vw, 14px);
        }

        .bubble-skill-ai .bubble-text {
            font-size: clamp(8px, 1vw, 12px);
        }

        .bubble-skill-other .bubble-text {
            font-size: clamp(7px, 0.8vw, 10px);
        }

        /* 气泡位置 */

        }

        .bubble-top-right {

            right: 12%;
        }

        .bubble-bottom-left {

            bottom: 12%;
            right: 12%;
        }

            right: 35%;

            left: 5%;
        }

        .bubble-right-center-2 {
            top: 35%;
            right: 5%;
        }

        .bubble-bottom-left-2 {

            left: 35%;
        }

        .bubble-bottom-right-2 {
            bottom: 8%;

        .bubble-bottom-left-3 {

        .bubble-right-center-3 {

            left: 5%;
        }

        .bubble-top-right-4 {

            right: 5%;
        }

        .bubble-bottom-left-4 {
            bottom: 5%;
            left: 5%;
        }

        .bubble-bottom-right-4 {
            bottom: 5%;
            right: 5%;

        .bubble-top-left-5 {

            left: 12%;
        }

        .bubble-top-right-5 {

        .bubble-bottom-left-5 {

        @media (max-width: 768px) {

                top: 45%;

            /* 顶部区域 */
            .bubble-top-center {

            }
            .bubble-top-left {

            }

                top: 5%;

            /* 上部两侧 */

            /* 中部两侧 */

            /* 下部 */

            /* 底部区域 */
            .bubble-bottom-left, .bubble-bottom-left-2 {
                bottom: 8%;
                left: 10%;
            }
            .bubble-bottom-right, .bubble-bottom-right-2 {
                bottom: 8%;
                right: 10%;
            }
            /* 角落 */
            .bubble-top-left-4 {
                top: 2%;
                left: 2%;
            }
            .bubble-top-right-4 {
                top: 2%;
                right: 2%;
            }
            .bubble-bottom-left-4 {
                bottom: 2%;

            .bubble-bottom-right-4 {

        .bubble:hover .bubble-text,
        .bubble.active .bubble-text {
            text-shadow: 0 0 20px rgba(168, 85, 247, 0.9);
            color: #ffffff;
            transform: scale(1.1);
        }

        /* 内容框 - 自适应大小 */
        .content-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: clamp(300px, 50vw, 600px);
            max-width: 90vw;
            max-height: 80vh;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: clamp(12px, 2vw, 20px);
            padding: clamp(20px, 4vw, 40px);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.3);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .content-box.visible {
            opacity: 1;
            transform: scale(1);
        }

        .content-box h3 {
            color: #a855f7;
            margin-bottom: clamp(8px, 1.5vw, 10px);
            font-size: clamp(14px, 2vw, 18px);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        .content-box p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
            font-size: clamp(11px, 1.5vw, 14px);
        }

        /* 连接线 */
        .connector {
            position: absolute;
            background: linear-gradient(90deg, rgba(168, 85, 247, 0.6), rgba(168, 85, 247, 0));
            height: 2px;
            z-index: 5;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .connector.visible {
            opacity: 1;
        }

        /* 动画效果 */
        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotateY(0deg) rotateX(0deg);
            }
            25% {
                transform: translate(240px, -240px) rotateY(40deg) rotateX(40deg);
            }
            50% {
                transform: translate(0, -480px) rotateY(0deg) rotateX(80deg);
            }
            75% {
                transform: translate(-240px, -240px) rotateY(-40deg) rotateX(40deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        /* 发光动画 */
        @keyframes glow {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translate(10%, -10%) rotate(180deg);
                opacity: 0.6;
            }
        }



        /* 响应式调整 */
        @media (max-width: 768px) {
            .bubble-large {
                width: 150px;
                height: 150px;
            }

            .profile-photo {
                width: 130px;
                height: 130px;
            }

            .bubble-medium {
                width: 100px;
                height: 100px;
            }

            .bubble-small {
                width: 60px;
                height: 60px;
            }

            .bubble-text {
                font-size: 12px;
            }

            .bubble-small .bubble-text {
                font-size: 10px;
            }
        }

        /* 鼠标水波纹效果 */
        #ripple-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.3);
            transform: scale(0);
            animation: ripple-animation 1s ease-out;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>

    <script>
        // 鼠标水波纹效果
        const rippleContainer = document.createElement('div');
        rippleContainer.id = 'ripple-container';
        document.body.appendChild(rippleContainer);

        document.addEventListener('mousemove', (e) => {
            // 限制水波纹的生成频率
            if (!rippleContainer.lastRippleTime || Date.now() - rippleContainer.lastRippleTime > 50) {
                const ripple = document.createElement('div');
                ripple.classList.add('ripple');
                
                // 设置水波纹的位置和大小
                const size = 50; // 水波纹的初始大小
                let x = e.clientX;
                let y = e.clientY;
                
                // 磁吸效果：吸引圆球
                const bubbles = document.querySelectorAll('.bubble');
                let closestBubble = null;
                let minDistance = Infinity;
                
                bubbles.forEach(bubble => {
                    const rect = bubble.getBoundingClientRect();
                    const bubbleCenterX = rect.left + rect.width / 2;
                    const bubbleCenterY = rect.top + rect.height / 2;
                    const distance = Math.sqrt(Math.pow(x - bubbleCenterX, 2) + Math.pow(y - bubbleCenterY, 2));
                    
                    if (distance < minDistance && distance < 150) {
                        minDistance = distance;
                        closestBubble = bubble;
                    }
                });
                
                if (closestBubble) {
                    const rect = closestBubble.getBoundingClientRect();
                    x = rect.left + rect.width / 2;

        // 初始化背景像素点
        function initPixelBackground() {
            const pixelBg = document.querySelector('.pixel-bg');
            const width = window.innerWidth;
            const height = window.innerHeight;
            const pixelCount = 500;

            for (let i = 0; i < pixelCount; i++) {

        // 更新内容框
        function updateContentBox(bubble, contentKey) {
            const content = contentData[currentLang][contentKey];
            if (!content) return;

            // 为赵梦婷气泡显示矩形照片
            if (contentKey === 'photo') {
                contentBox.innerHTML = `
                    <h3>${content.title}</h3>
                    <div style="text-align: center; margin: 15px 0;">
                        <img src="照片.png" alt="个人照片" style="width: 200px; height: auto; border-radius: 8px; border: 2px solid rgba(168, 85, 247, 0.7); box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);">
                    </div>
                    <p>${content.content.replace(/\n/g, '<br>')}</p>
                `;
            } else {
                contentBox.innerHTML = `
                    <h3>${content.title}</h3>
                    <p>${content.content.replace(/\n/g, '<br>')}</p>
                `;
            }

            // 计算内容框位置
            const bubbleRect = bubble.getBoundingClientRect();
            const bubbleCenterX = bubbleRect.left + bubbleRect.width / 2;
            const bubbleCenterY = bubbleRect.top + bubbleRect.height / 2;

            // 确定内容框位置（避免超出屏幕）
            let boxX, boxY;
            if (bubbleCenterX < window.innerWidth / 2) {
                boxX = bubbleRect.right + 20;
            } else {
                boxX = bubbleRect.left - contentBox.offsetWidth - 20;
            }

            if (bubbleCenterY < window.innerHeight / 2) {
                boxY = bubbleCenterY - contentBox.offsetHeight / 2;
            } else {
                boxY = bubbleCenterY - contentBox.offsetHeight / 2;
            }

            // 确保内容框在屏幕内
            boxX = Math.max(10, Math.min(boxX, window.innerWidth - contentBox.offsetWidth - 10));
            boxY = Math.max(10, Math.min(boxY, window.innerHeight - contentBox.offsetHeight - 10));

            contentBox.style.left = boxX + 'px';
            contentBox.style.top = boxY + 'px';

            // 显示内容框
            contentBox.classList.add('visible');

            // 更新连接线
            updateConnector(bubble, contentBox);
        }

        // 更新连接线
        function updateConnector(bubble, box) {
            const bubbleRect = bubble.getBoundingClientRect();
            const boxRect = box.getBoundingClientRect();

            const bubbleCenterX = bubbleRect.left + bubbleRect.width / 2;
            const bubbleCenterY = bubbleRect.top + bubbleRect.height / 2;
            const boxCenterX = boxRect.left + boxRect.width / 2;
            const boxCenterY = boxRect.top + boxRect.height / 2;

            const distance = Math.sqrt(Math.pow(boxCenterX - bubbleCenterX, 2) + Math.pow(boxCenterY - bubbleCenterY, 2));
            const angle = Math.atan2(boxCenterY - bubbleCenterY, boxCenterX - bubbleCenterX);

            connector.style.width = distance + 'px';
            connector.style.left = bubbleCenterX + 'px';
            connector.style.top = bubbleCenterY + 'px';
            connector.style.transformOrigin = '0 0';
            connector.style.transform = `rotate(${angle}rad)`;

            connector.classList.add('visible');
        }

        // 隐藏内容框
        function hideContentBox() {
            contentBox.classList.remove('visible');
            connector.classList.remove('visible');
            bubbles.forEach(bubble => bubble.classList.remove('active'));
        }

        // 绑定气泡事件
        function bindBubbleEvents() {
            bubbles.forEach(bubble => {
                bubble.addEventListener('click', function() {
                    const contentKey = this.getAttribute('data-content');
                    
                    // 如果当前气泡已激活，则隐藏内容框
                    if (this.classList.contains('active')) {
                        hideContentBox();
                    } else {
                        // 先隐藏所有内容
                        hideContentBox();
                        // 激活当前气泡
                        this.classList.add('active');
                        // 显示内容框
                        updateContentBox(this, contentKey);
                    }
                });

                bubble.addEventListener('mouseenter', function() {
                    const contentKey = this.getAttribute('data-content');
                    // 鼠标悬停时显示内容框
                    if (!this.classList.contains('active')) {
                        // 先隐藏所有内容
                        hideContentBox();
                        // 激活当前气泡
                        this.classList.add('active');
                        // 显示内容框
                        updateContentBox(this, contentKey);
                    }
                });

                bubble.addEventListener('mouseleave', function() {
                    // 鼠标离开时隐藏内容框
                    if (this.classList.contains('active')) {
                        hideContentBox();
                    }
                });
            });

            // 点击空白处隐藏内容框
            document.addEventListener('click', function(e) {
                if (!e.target.closest('.bubble') && !e.target.closest('.content-box')) {
                    hideContentBox();
                }
            });
        }

        // 语言切换
        function updateLanguage() {
            // 更新所有气泡标题
            document.querySelectorAll('[data-lang-title]').forEach(el => {
                const key = el.getAttribute('data-lang-title');
                if (contentData[currentLang].titles && contentData[currentLang].titles[key]) {
                    el.textContent = contentData[currentLang].titles[key];
                }
            });
            
            // 重新显示当前激活的气泡内容
            const activeBubble = document.querySelector('.bubble.active');
            if (activeBubble) {
                const contentKey = activeBubble.getAttribute('data-content');
                updateContentBox(activeBubble, contentKey);
            }
        }

        // 监听来自父窗口的语言变化
        window.addEventListener('message', function(event) {
            if (event.data.type === 'languageChange') {
                currentLang = event.data.lang;
                updateLanguage();
            }
        });

        // 为气泡添加不规则波动效果
        function addBubbleWaves() {
            const bubbles = document.querySelectorAll('.bubble');
            
            bubbles.forEach(bubble => {
                // 获取气泡的原始大小
                const originalWidth = parseFloat(getComputedStyle(bubble).width);
                const originalHeight = parseFloat(getComputedStyle(bubble).height);
                
                // 波动幅度设置为气泡大小的30%，确保不超过自身大小
                const waveAmplitude = Math.min(originalWidth, originalHeight) * 0.3;
                
                // 随机生成波动频率（减慢一半）
                const waveFrequency = (0.02 + Math.random() * 0.03) * 0.5;
                
                // 存储气泡的当前状态
                let time = 0;
                
                // 动画函数
                function animate() {
                    // 生成不规则波动
                    const offsetX = Math.sin(time * waveFrequency + Math.sin(time * 0.005)) * waveAmplitude;
                    const offsetY = Math.cos(time * waveFrequency + Math.cos(time * 0.01)) * waveAmplitude;
                    const scaleX = 1 + Math.sin(time * waveFrequency * 1.2 + Math.sin(time * 0.015)) * 0.15;
                    const scaleY = 1 + Math.cos(time * waveFrequency * 1.1 + Math.cos(time * 0.02)) * 0.15;
                    
                    // 应用变换
                    bubble.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scaleX}, ${scaleY})`;
                    
                    // 增加时间（减慢一半）
                    time += 0.5;
                    
                    // 继续动画
                    requestAnimationFrame(animate);
                }
                
                // 开始动画
                animate();
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initPixelBackground();
            bindBubbleEvents();
            addBubbleWaves();
        });

        // 窗口大小改变时重新计算位置
        window.addEventListener('resize', () => {
            const activeBubble = document.querySelector('.bubble.active');
            if (activeBubble) {
                const contentKey = activeBubble.getAttribute('data-content');
                updateContentBox(activeBubble, contentKey);
            }
        });
